<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - PawPlay Haven</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
<nav class="nav">
<div class="logo">PawPlay Haven</div>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="cart.html" class="nav-cart">Cart <span id="cart-count">0</span></a></li>
</ul>
<div class="nav-mobile" id="nav-mobile">&#9776;</div>
</nav>
</header>

<section class="section checkout-section">
<div class="container">
<h2 class="section-title">Checkout</h2>
<div class="checkout-wrapper">
<div class="checkout-form">
<form id="checkout-form">
<div class="form-group">
<label>Full Name <span class="req">*</span></label>
<input type="text" name="name" placeholder="Enter your full name" required>
</div>
<div class="form-group">
<label>Phone <span class="req">*</span></label>
<input type="tel" name="phone" placeholder="Enter your phone number" required>
</div>
<div class="form-group">
<label>Address <span class="req">*</span></label>
<textarea name="address" placeholder="Enter your delivery address" rows="3" required></textarea>
</div>
<div class="form-row">
<div class="form-group">
<label>Pincode <span class="req">*</span></label>
<input type="text" name="pincode" placeholder="Pincode" required maxlength="6">
</div>
<div class="form-group">
<label>Colour</label>
<select name="colour">
<option value="Orange">Orange</option>
<option value="Teal">Teal</option>
</select>
</div>
</div>
<div class="form-group">
<label>Payment Method <span class="req">*</span></label>
<div class="payment-options">
<label class="payment-option">
<input type="radio" name="payment" value="upi" required> UPI
</label>
<label class="payment-option">
<input type="radio" name="payment" value="card"> Card
</label>
<label class="payment-option">
<input type="radio" name="payment" value="cod"> Cash on Delivery
</label>
</div>
</div>
<div class="order-total">
<strong>Total:</strong> <span id="checkout-total">&#8377; 4,999</span>
</div>
<button type="submit" class="btn-place-order">Place Order</button>
</form>
</div>
<div class="checkout-sidebar">
<div class="summary-card">
<h3>Order Summary</h3>
<div class="summary-item">
<span>PawPlay Haven Smart Puzzle Treat Station</span>
<span>&#8377; 4,999</span>
</div>
<div class="summary-item">
<span>Shipping</span>
<span class="free">Free</span>
</div>
<div class="summary-item total">
<span>Total</span>
<span>&#8377; 4,999</span>
</div>
<p class="note">You'll be redirected to a success page after placing your order.</p>
</div>
</div>
</div>
</section>

<footer class="footer">
<div class="container">
<p>&copy; 2026 PawPlay Haven. Smart Puzzle Treat Station for dogs.</p>
</div>
</footer>

<script src="script.js"></script>
</body>
</html>
