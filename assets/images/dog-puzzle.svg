<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d7a2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b87a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e87a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c05a1e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#fff8e7" />
  <circle cx="300" cy="300" r="260" fill="#f3e9d2" opacity="0.6" />

  <!-- Shadow -->
  <ellipse cx="300" cy="470" rx="170" ry="30" fill="#000" opacity="0.12" />

  <!-- Puzzle station base -->
  <g transform="translate(240, 300)">
    <rect x="0" y="40" width="240" height="120" rx="16" fill="#d4a373" stroke="#a67c52" stroke-width="3" />
    <rect x="20" y="60" width="40" height="40" rx="6" fill="#e87a2e" />
    <rect x="80" y="50" width="50" height="30" rx="6" fill="#f5d7a2" />
    <rect x="150" y="70" width="30" height="30" rx="6" fill="#d4a373" />
    <rect x="180" y="60" width="40" height="40" rx="6" fill="#f5d7a2" />
    <circle cx="60" cy="100" r="10" fill="#fff" opacity="0.9" />
    <circle cx="200" cy="100" r="10" fill="#fff" opacity="0.9" />
    <circle cx="110" cy="120" r="8" fill="#fff" opacity="0.9" />
    <circle cx="170" cy="115" r="8" fill="#fff" opacity="0.9" />
    <!-- Treats -->
    <ellipse cx="55" cy="95" rx="7" ry="4" fill="#f0c27b" transform="rotate(-15 55 95)" />
    <ellipse cx="105" cy="115" rx="7" ry="4" fill="#f0c27b" transform="rotate(15 105 115)" />
    <ellipse cx="165" cy="105" rx="7" ry="4" fill="#f0c27b" transform="rotate(-20 165 105)" />
  </g>

  <!-- Dog body -->
  <g transform="translate(330, 220)">
    <ellipse cx="90" cy="100" rx="85" ry="70" fill="url(#bodyGrad)" />
    <!-- Legs -->
    <rect x="55" cy="140" width="26" height="55" rx="13" transform="translate(55,0)" fill="#e8b87a" />
    <rect x="115" cy="140" width="26" height="55" rx="13" transform="translate(115,0)" fill="#d4a373" />
    <rect x="10" cy="130" width="22" height="45" rx="11" fill="#e8b87a" />
    <rect x="145" cy="130" width="22" height="45" rx="11" fill="#d4a373" />
    <!-- Tail -->
    <path d="M 175 90 Q 210 90 220 130 Q 215 140 205 135" stroke="#d4a373" stroke-width="14" fill="none" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="45" cy="45" r="42" fill="url(#bodyGrad)" />
    <!-- Ears -->
    <ellipse cx="20" cy="25" rx="14" ry="24" fill="#d4a373" transform="rotate(-20 20 25)" />
    <ellipse cx="70" cy="22" rx="14" ry="26" fill="#e8b87a" transform="rotate(20 70 22)" />
    <!-- Face -->
    <circle cx="30" cy="42" r="6" fill="#4b3621" />
    <circle cx="58" cy="42" r="6" fill="#4b3621" />
    <oval cx="44" cy="52" rx="4" ry="7" fill="#f0c27b" />
    <!-- Cheek spots -->
    <circle cx="18" cy="50" r="5" fill="#d4a373" opacity="0.6" />
    <circle cx="68" cy="50" r="5" fill="#e8b87a" opacity="0.6" />
    <!-- Collar -->
    <rect cx="44" cy="62" width="44" height="10" rx="5" fill="#e87a2e" />
    <circle cx="44" cy="62" r="4" fill="#f5d7a2" />
  </g>

  <!-- Happy expression lines -->
  <path d="M 30 55 Q 44 65 58 55" stroke="#4b3621" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 38 38 Q 44 44 50 38" stroke="#4b3621" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 50 38 Q 44 44 38 38" stroke="#4b3621" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Paw reaching toward puzzle -->
  <g transform="translate(290, 330) rotate(-15)">
    <ellipse cx="0" cy="0" rx="20" ry="14" fill="#e8b87a" />
    <circle cx="-8" cy="-4" r="4" fill="#d4a373" opacity="0.7" />
    <circle cx="0" cy="-4" r="4" fill="#d4a373" opacity="0.7" />
    <circle cx="8" cy="-4" r="4" fill="#d4a373" opacity="0.7" />
    <circle cx="16" cy="-4" r="4" fill="#d4a373" opacity="0.7" />
  </g>

  <!-- Treat in air -->
  <ellipse cx="280" cy="250" rx="10" ry="6" fill="#f0c27b" opacity="0.9" />
  <path d="M 270 240 Q 280 250 290 240" stroke="#d4a373" stroke-width="2" fill="none" />

  <!-- Decorative elements -->
  <circle cx="120" cy="120" r="20" fill="#e87a2e" opacity="0.15" />
  <circle cx="480" cy="480" r="25" fill="#f5d7a2" opacity="0.5" />
  <circle cx="520" cy="140" r="18" fill="#d4a373" opacity="0.2" />
</svg>